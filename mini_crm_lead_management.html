<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Mini CRM — Lead Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);

    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    --border-radius-lg: 14px;
    --border-radius-md: 8px;
    --accent: #534AB7;
    --accent-dark: #3C3489;
    --accent-tint: #EEEDFE;

    --color-background-page: #EFEFF3;
    --color-background-primary: #FFFFFF;
    --color-background-secondary: #F5F5F8;
    --color-background-tertiary: #EDEDF2;
    --color-background-success: #E3F5E9;
    --color-background-info: #E6F1FB;
    --color-background-warning: #FDF3E1;
    --color-background-danger: #FBEAEA;

    --color-text-primary: #1B1C1F;
    --color-text-secondary: #6B6E76;
    --color-text-success: #1E6B3C;
    --color-text-info: #0C447C;
    --color-text-warning: #8A5A12;
    --color-text-danger: #A23434;

    --color-border-primary: #534AB7;
    --color-border-secondary: #D8D8DF;
    --color-border-tertiary: #E6E6EC;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --color-background-page: #131318;
      --color-background-primary: #1C1D22;
      --color-background-secondary: #232429;
      --color-background-tertiary: #1A1B20;
      --color-background-success: #113321;
      --color-background-info: #102B42;
      --color-background-warning: #3A2C0E;
      --color-background-danger: #3A1717;

      --color-text-primary: #F1F1F4;
      --color-text-secondary: #9A9CA6;
      --color-text-success: #6FD79A;
      --color-text-info: #7FBAEF;
      --color-text-warning: #E8B85C;
      --color-text-danger: #E88585;

      --accent-tint: #262151;
      --color-border-secondary: #33343B;
      --color-border-tertiary: #2A2B31;
    }
  }

  :root[data-theme="dark"] {
    --color-background-page: #131318;
    --color-background-primary: #1C1D22;
    --color-background-secondary: #232429;
    --color-background-tertiary: #1A1B20;
    --color-background-success: #113321;
    --color-background-info: #102B42;
    --color-background-warning: #3A2C0E;
    --color-background-danger: #3A1717;

    --color-text-primary: #F1F1F4;
    --color-text-secondary: #9A9CA6;
    --color-text-success: #6FD79A;
    --color-text-info: #7FBAEF;
    --color-text-warning: #E8B85C;
    --color-text-danger: #E88585;

    --accent-tint: #262151;
    --color-border-secondary: #33343B;
    --color-border-tertiary: #2A2B31;
  }

  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-sans);
    font-size: 14px;
    color: var(--color-text-primary);
    background: var(--color-background-page);
    -webkit-font-smoothing: antialiased;
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); border: 0;
  }

  button, input, select { font-family: inherit; }
  button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }

  .app-shell {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
  }

  .app {
    flex: 1;
    min-height: 0;
    background: var(--color-background-tertiary);
    border-radius: var(--border-radius-lg);
    border: 0.5px solid var(--color-border-tertiary);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }

  .topbar {
    background: var(--color-background-primary);
    border-bottom: 0.5px solid var(--color-border-tertiary);
    padding: 12px 20px;
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }

  .topbar-title { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .topbar-right { display: flex; align-items: center; gap: 10px; }

  .badge {
    font-size: 11px; padding: 3px 8px; border-radius: 20px; font-weight: 500;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .badge-success { background: var(--color-background-success); color: var(--color-text-success); }
  .badge-info { background: var(--color-background-info); color: var(--color-text-info); }
  .badge-warning { background: var(--color-background-warning); color: var(--color-text-warning); }
  .badge-new { background: var(--accent-tint); color: var(--accent-dark); }
  .badge-dim { background: var(--color-background-secondary); color: var(--color-text-secondary); }

  .main {
    display: grid;
    grid-template-columns: 200px 1fr;
    flex: 1;
    min-height: 0;
  }

  .sidebar {
    background: var(--color-background-primary);
    border-right: 0.5px solid var(--color-border-tertiary);
    padding: 16px 12px;
    display: flex; flex-direction: column; gap: 4px;
    overflow-y: auto;
  }

  .nav-item {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-radius: var(--border-radius-md);
    cursor: pointer; font-size: 13px; color: var(--color-text-secondary);
    border: none; background: none; width: 100%; text-align: left;
    white-space: nowrap;
  }
  .nav-item:hover { background: var(--color-background-secondary); }
  .nav-item.active { background: var(--accent-tint); color: var(--accent-dark); font-weight: 500; }
  .nav-item svg { flex-shrink: 0; }
  .nav-label { overflow: hidden; text-overflow: ellipsis; }

  .content { overflow-y: auto; padding: 20px; min-width: 0; }

  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 10px; flex-wrap: wrap; }
  .section-title { font-size: 15px; font-weight: 600; }
  .section-actions { display: flex; gap: 8px; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px;
    border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-secondary);
    background: var(--color-background-primary); font-size: 13px; cursor: pointer;
    color: var(--color-text-primary); transition: background .12s ease;
  }
  .btn:hover { background: var(--color-background-secondary); }
  .btn:disabled { opacity: 0.55; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
  .btn-sm { padding: 4px 10px; font-size: 12px; }

  .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
  @media (max-width: 560px) { .metrics { grid-template-columns: repeat(2, 1fr); } }
  .metric { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 12px; }
  .metric-label { font-size: 12px; color: var(--color-text-secondary); margin-bottom: 4px; }
  .metric-value { font-size: 22px; font-weight: 600; }

  .leads-table { background: var(--color-background-primary); border-radius: var(--border-radius-lg); border: 0.5px solid var(--color-border-tertiary); overflow: hidden; }

  .table-toolbar { padding: 12px 16px; border-bottom: 0.5px solid var(--color-border-tertiary); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  .search-wrap { position: relative; flex: 1; min-width: 160px; }
  .search-wrap svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--color-text-secondary); pointer-events: none; }
  .search-input {
    width: 100%; padding: 6px 10px 6px 30px; border: 0.5px solid var(--color-border-secondary);
    border-radius: var(--border-radius-md); background: var(--color-background-secondary);
    font-size: 13px; color: var(--color-text-primary);
  }
  .search-input:focus { outline: none; border-color: var(--accent); }

  select.filter-select, select.sort-select {
    padding: 6px 10px; border: 0.5px solid var(--color-border-secondary);
    border-radius: var(--border-radius-md); background: var(--color-background-secondary);
    font-size: 13px; color: var(--color-text-primary);
  }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 640px; }
  th { font-size: 11px; font-weight: 600; color: var(--color-text-secondary); text-align: left; padding: 10px 16px; border-bottom: 0.5px solid var(--color-border-tertiary); background: var(--color-background-secondary); white-space: nowrap; }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--color-text-primary); }
  th .sort-arrow { margin-left: 3px; opacity: 0.6; }
  td { padding: 11px 16px; border-bottom: 0.5px solid var(--color-border-tertiary); font-size: 13px; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--color-background-secondary); }

  .avatar { width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; flex-shrink: 0; }
  .av-purple { background: #EEEDFE; color: #3C3489; }
  .av-teal   { background: #E1F5EE; color: #085041; }
  .av-blue   { background: #E6F1FB; color: #0C447C; }
  .av-coral  { background: #FAECE7; color: #712B13; }
  .av-pink   { background: #FBEAF0; color: #72243E; }

  .lead-name-cell { display: flex; align-items: center; gap: 8px; }
  .lead-email { font-size: 12px; color: var(--color-text-secondary); }

  .status-pill {
    display: inline-flex; align-items: center; gap: 4px; padding: 3px 22px 3px 8px;
    border-radius: 20px; font-size: 11px; font-weight: 500; cursor: pointer;
    border: 0.5px solid transparent; appearance: none; background-repeat: no-repeat;
    background-position: right 7px center; background-size: 9px;
  }
  .status-new       { background-color: var(--accent-tint); color: var(--accent-dark); }
  .status-contacted { background-color: var(--color-background-info); color: var(--color-text-info); }
  .status-converted { background-color: var(--color-background-success); color: var(--color-text-success); }
  .status-lost      { background-color: var(--color-background-danger); color: var(--color-text-danger); }

  .action-btn {
    background: none; border: none; cursor: pointer; color: var(--color-text-secondary);
    padding: 5px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center;
  }
  .action-btn:hover { color: var(--color-text-primary); background: var(--color-background-secondary); }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center;
    justify-content: center; z-index: 100; padding: 16px;
  }
  .modal {
    background: var(--color-background-primary); border-radius: var(--border-radius-lg);
    border: 0.5px solid var(--color-border-secondary); width: 440px; max-width: 100%;
    max-height: 90vh; overflow-y: auto; padding: 20px;
  }
  .modal-title { font-size: 15px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }

  .form-group { margin-bottom: 14px; }
  .form-label { font-size: 12px; color: var(--color-text-secondary); margin-bottom: 5px; display: block; }
  .form-input {
    width: 100%; padding: 7px 10px; border: 0.5px solid var(--color-border-secondary);
    border-radius: var(--border-radius-md); font-size: 13px; background: var(--color-background-secondary);
    color: var(--color-text-primary);
  }
  .form-input:focus { outline: none; border-color: var(--accent); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .notes-list { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; max-height: 180px; overflow-y: auto; }
  .note-item { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 8px 10px; font-size: 12px; }
  .note-time { color: var(--color-text-secondary); font-size: 11px; margin-bottom: 2px; }

  .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; padding-top: 14px; border-top: 0.5px solid var(--color-border-tertiary); }

  .ai-response { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 10px; font-size: 12px; color: var(--color-text-secondary); line-height: 1.6; margin-top: 8px; border-left: 2px solid var(--accent); white-space: pre-wrap; }
  .ai-error { border-left-color: var(--color-text-danger); }

  .login-wrap { display: flex; align-items: center; justify-content: center; flex: 1; padding: 20px; }
  .login-card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 28px 24px; width: 320px; max-width: 100%; }
  .login-logo { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; font-size: 15px; font-weight: 600; }

  .empty-notes { color: var(--color-text-secondary); font-size: 12px; font-style: italic; }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--color-text-secondary); }
  .empty-state svg { margin-bottom: 10px; opacity: 0.5; }

  .stat-bar { height: 4px; background: var(--color-background-secondary); border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .stat-fill { height: 100%; border-radius: 2px; background: var(--accent); }

  .sync-note { font-size: 11px; color: var(--color-text-secondary); display: flex; align-items: center; gap: 5px; }
  .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--color-text-success); flex-shrink: 0; }
  .sync-dot.local { background: var(--color-text-warning); }

  .toast {
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    background: var(--color-text-primary); color: var(--color-background-primary);
    padding: 8px 14px; border-radius: var(--border-radius-md); font-size: 12px; z-index: 200;
    box-shadow: 0 4px 14px rgba(0,0,0,0.2);
  }

  @media (max-width: 700px) {
    .main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
    .sidebar {
      flex-direction: row; border-right: none; border-top: 0.5px solid var(--color-border-tertiary);
      padding: 6px max(6px, env(safe-area-inset-left, 0px)) max(6px, env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-right, 0px));
      justify-content: space-around; order: 2; gap: 2px;
    }
    .nav-item { flex-direction: column; gap: 2px; font-size: 10px; padding: 6px 8px; text-align: center; }
    .content { order: 1; padding: 14px; }
    .form-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="app-shell">
  <h1 class="sr-only">Mini CRM — Lead Management</h1>
  <div class="app" id="app"></div>
</div>

<script>
  /* ---------- icon set (inline SVG, no external font dependency) ---------- */
  const ICONS = {
    'chart-dots': '<path d="M3 3v18h18"/><path d="M7.5 14l4.5-4 4.5-3 4-2.5"/><circle cx="7.5" cy="14" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="10" r="1.6" fill="currentColor" stroke="none"/><circle cx="16.5" cy="7" r="1.6" fill="currentColor" stroke="none"/>',
    'shield-check': '<path d="M12 3l7 3v5c0 4.8-3 8.4-7 10-4-1.6-7-5.2-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/>',
    'logout': '<path d="M9 21H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3"/><path d="M15 17l5-5-5-5"/><path d="M20 12H9"/>',
    'users': '<path d="M16 20v-1.5a3.5 3.5 0 0 0-3.5-3.5h-5A3.5 3.5 0 0 0 4 18.5V20"/><circle cx="8.5" cy="8.5" r="3.5"/><path d="M22 20v-1.5a3.5 3.5 0 0 0-2.5-3.35"/><path d="M15 5.13a3.5 3.5 0 0 1 0 6.74"/>',
    'chart-bar': '<path d="M4 20V10"/><path d="M11 20V4"/><path d="M18 20v-7"/>',
    'plus': '<path d="M12 5v14"/><path d="M5 12h14"/>',
    'eye': '<path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
    'trash': '<path d="M4 7h16"/><path d="M9 7V4.8c0-.44.36-.8.8-.8h4.4c.44 0 .8.36.8.8V7"/><path d="M18 7l-.8 12.2a2 2 0 0 1-2 1.8H8.8a2 2 0 0 1-2-1.8L6 7"/><path d="M10 11v6"/><path d="M14 11v6"/>',
    'x': '<path d="M18 6L6 18"/><path d="M6 6l12 12"/>',
    'send': '<path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/>',
    'sparkles': '<path d="M12 3l1.6 4.7L18 9l-4.4 1.6L12 15l-1.6-4.4L6 9l4.4-1.3L12 3z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8L19 15z"/>',
    'lock-open': '<rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.6-1.8"/>',
    'search': '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/>',
    'download': '<path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/>',
    'chevron-down': '<path d="M6 9l6 6 6-6"/>'
  };
  function icon(name, size) {
    size = size || 16;
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ''}</svg>`;
  }
  function selectArrowDataUri(color) {
    const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='${color}' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>`;
    return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
  }

  /* ---------- constants & helpers ---------- */
  const COLORS = ['av-purple', 'av-teal', 'av-blue', 'av-coral', 'av-pink'];
  const initials = n => (n || '?').trim().split(/\s+/).map(w => w[0]).join('').toUpperCase().slice(0, 2);
  const colorFor = n => COLORS[(n || '').charCodeAt(0) % COLORS.length];
  const fmtDate = d => { const dt = new Date(d); return isNaN(dt) ? '—' : dt.toLocaleDateString('en-IN', {day: 'numeric', month: 'short'}); };
  const statusClass = {new: 'status-new', contacted: 'status-contacted', converted: 'status-converted', lost: 'status-lost'};
  const statusLabel = {new: 'New', contacted: 'Contacted', converted: 'Converted', lost: 'Lost'};
  const LOCAL_LEADS_KEY = 'minicrm_leads_v1';
  const LOCAL_NEXTID_KEY = 'minicrm_nextid_v1';
  const SESSION_KEY = 'minicrm_session_v1';

  function defaultLeads() {
    return [
      {id: '1', name: 'Priya Sharma', email: 'priya@techstartup.in', source: 'Contact Form', status: 'new', date: '2026-06-01', notes: [{text: 'Interested in our SaaS product', time: '2026-06-01T10:30:00'}]},
      {id: '2', name: 'Rahul Mehta', email: 'rahul.mehta@gmail.com', source: 'LinkedIn', status: 'contacted', date: '2026-06-02', notes: [{text: 'Called — asked for proposal', time: '2026-06-02T14:00:00'}]},
      {id: '3', name: 'Anjali Singh', email: 'anjali@designco.in', source: 'Referral', status: 'converted', date: '2026-05-28', notes: [{text: 'Signed contract for 3 months', time: '2026-05-30T11:00:00'}]},
      {id: '4', name: 'Vikram Nair', email: 'vikram@ecommerce.io', source: 'Contact Form', status: 'new', date: '2026-06-05', notes: []},
      {id: '5', name: 'Sneha Patel', email: 'sneha@agency.com', source: 'Instagram', status: 'lost', date: '2026-06-03', notes: [{text: 'Went with competitor', time: '2026-06-04T09:00:00'}]},
      {id: '6', name: 'Arjun Das', email: 'arjun.das@fintech.co', source: 'Contact Form', status: 'contacted', date: '2026-06-07', notes: []}
    ];
  }

  let state = {
    loggedIn: false,
    view: 'leads',
    leads: [],
    dataMode: 'loading', // 'db' | 'local' | 'loading'
    search: '',
    filterStatus: 'all',
    sortKey: 'date',
    sortDir: 'desc',
    modal: null,
    newNote: '',
    aiInsight: '',
    aiLoading: false,
    nextId: 7,
    addForm: {name: '', email: '', source: 'Contact Form', status: 'new'},
    toast: ''
  };

  let dbApi = null, sampleApi = null, downloadsApi = null;
  let toastTimer = null;

  /* ---------- capability access ---------- */
  async function getCapability(name) {
    try {
      if (typeof window.claude === 'undefined' || typeof window.claude.use !== 'function') return null;
      return await window.claude.use(name);
    } catch (e) { return null; }
  }

  async function boot() {
    try { if (sessionStorage.getItem(SESSION_KEY) === '1') state.loggedIn = true; } catch (e) {}
    render();

    dbApi = await getCapability('db');
    sampleApi = await getCapability('sample');
    downloadsApi = await getCapability('downloads');

    if (dbApi) {
      state.dataMode = 'db';
      subscribeToLeads();
    } else {
      state.dataMode = 'local';
      loadLocalLeads();
      render();
    }
  }

  /* ---------- local storage fallback ---------- */
  function loadLocalLeads() {
    try {
      const raw = localStorage.getItem(LOCAL_LEADS_KEY);
      state.leads = raw ? JSON.parse(raw) : defaultLeads();
      const nid = localStorage.getItem(LOCAL_NEXTID_KEY);
      state.nextId = nid ? parseInt(nid, 10) : 7;
      if (!raw) saveLocalLeads();
    } catch (e) { state.leads = defaultLeads(); }
  }
  function saveLocalLeads() {
    try {
      localStorage.setItem(LOCAL_LEADS_KEY, JSON.stringify(state.leads));
      localStorage.setItem(LOCAL_NEXTID_KEY, String(state.nextId));
    } catch (e) {}
  }

  /* ---------- db-backed leads ---------- */
  async function ensureSeeded() {
    try {
      const marker = await dbApi.doc('meta/seeded').get();
      if (!marker.exists) {
        const seed = defaultLeads();
        for (const l of seed) {
          await dbApi.collection('leads').doc(l.id).set({
            name: l.name, email: l.email, source: l.source, status: l.status, date: l.date, notes: l.notes
          });
        }
        await dbApi.doc('meta/seeded').set({seeded: true, at: new Date().toISOString()});
      }
    } catch (e) { /* seeding is best-effort */ }
  }

  function subscribeToLeads() {
    ensureSeeded().finally(() => {
      dbApi.collection('leads').onSnapshot(snap => {
        state.leads = snap.docs.map(d => ({id: d.id, ...d.data()})).map(l => ({...l, notes: l.notes || []}));
        if (state.modal) {
          state.modal = state.leads.find(l => l.id === state.modal.id) || null;
        }
        render();
      }, err => {
        showToast('Live sync unavailable — switched to local storage.');
        state.dataMode = 'local';
        loadLocalLeads();
        render();
      });
    });
  }

  function newLeadId() {
    return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'l' + Date.now() + Math.random().toString(16).slice(2);
  }

  function showToast(msg) {
    state.toast = msg;
    render();
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { state.toast = ''; render(); }, 3200);
  }

  /* ---------- render ---------- */
  function render() {
    const active = document.activeElement;
    const focusId = active && active.id;
    const selStart = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
    const selEnd = active && typeof active.selectionEnd === 'number' ? active.selectionEnd : null;

    const app = document.getElementById('app');
    if (!state.loggedIn) { app.innerHTML = renderLogin(); restoreFocus(focusId, selStart, selEnd); return; }
    app.innerHTML = `
    <div class="topbar">
      <div class="topbar-title">${icon('chart-dots', 18)} Mini CRM</div>
      <div class="topbar-right">
        ${syncBadge()}
        <span class="badge badge-success">${icon('shield-check', 12)} Admin</span>
        <button class="btn btn-sm" onclick="logout()">${icon('logout', 14)} Sign out</button>
      </div>
    </div>
    <div class="main">
      <nav class="sidebar">
        ${navItem('leads', 'users', 'Leads')}
        ${navItem('analytics', 'chart-bar', 'Analytics')}
        ${navItem('add', 'plus', 'Add Lead')}
      </nav>
      <div class="content">
        ${state.view === 'leads' ? renderLeads() : state.view === 'analytics' ? renderAnalytics() : renderAddForm()}
      </div>
    </div>
    ${state.modal ? renderModal() : ''}
    ${state.toast ? `<div class="toast">${state.toast}</div>` : ''}
  `;
    restoreFocus(focusId, selStart, selEnd);
  }

  function restoreFocus(id, start, end) {
    if (!id) return;
    const el = document.getElementById(id);
    if (!el || typeof el.focus !== 'function') return;
    el.focus();
    if (start !== null && typeof el.setSelectionRange === 'function') {
      try { el.setSelectionRange(start, end); } catch (e) {}
    }
  }

  function syncBadge() {
    if (state.dataMode === 'db') return `<span class="sync-note"><span class="sync-dot"></span>Synced</span>`;
    if (state.dataMode === 'local') return `<span class="sync-note"><span class="sync-dot local"></span>Saved on this device</span>`;
    return `<span class="sync-note">Loading…</span>`;
  }

  function navItem(v, ic, label) {
    return `<button class="nav-item${state.view === v ? ' active' : ''}" onclick="setView('${v}')">${icon(ic, 17)}<span class="nav-label">${label}</span></button>`;
  }

  function renderLogin() {
    return `<div class="login-wrap"><div class="login-card">
    <div class="login-logo">${icon('chart-dots', 20)}Mini CRM</div>
    <div class="form-group"><label class="form-label">Username</label><input class="form-input" id="uname" type="text" placeholder="admin" onkeydown="if(event.key==='Enter')doLogin()" /></div>
    <div class="form-group"><label class="form-label">Password</label><input class="form-input" id="upass" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()" /></div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px" onclick="doLogin()">${icon('lock-open', 15)}Sign in</button>
    <p style="font-size:11px;color:var(--color-text-secondary);margin-top:12px;text-align:center">Use <strong>admin</strong> / <strong>admin123</strong></p>
  </div></div>`;
  }

  function sortedFilteredLeads() {
    let leads = state.leads.filter(l => {
      const q = state.search.toLowerCase();
      const match = !q || l.name.toLowerCase().includes(q) || l.email.toLowerCase().includes(q) || l.source.toLowerCase().includes(q);
      return match && (state.filterStatus === 'all' || l.status === state.filterStatus);
    });
    const {sortKey, sortDir} = state;
    const dir = sortDir === 'asc' ? 1 : -1;
    leads = leads.slice().sort((a, b) => {
      let av = a[sortKey], bv = b[sortKey];
      if (sortKey === 'date') { av = new Date(av).getTime() || 0; bv = new Date(bv).getTime() || 0; }
      else { av = (av || '').toString().toLowerCase(); bv = (bv || '').toString().toLowerCase(); }
      if (av < bv) return -1 * dir;
      if (av > bv) return 1 * dir;
      return 0;
    });
    return leads;
  }

  function sortArrow(key) {
    if (state.sortKey !== key) return '';
    return `<span class="sort-arrow">${state.sortDir === 'asc' ? '↑' : '↓'}</span>`;
  }

  function renderLeads() {
    const leads = sortedFilteredLeads();
    const arrowColor = getComputedStyle(document.documentElement).getPropertyValue('--color-text-secondary').trim() || '#6B6E76';
    return `
    <div class="section-header">
      <div class="section-title">Leads <span style="color:var(--color-text-secondary);font-weight:400;font-size:13px">(${leads.length})</span></div>
      <div class="section-actions">
        <button class="btn btn-sm" onclick="exportCSV()">${icon('download', 14)} Export CSV</button>
      </div>
    </div>
    <div class="leads-table">
      <div class="table-toolbar">
        <div class="search-wrap">${icon('search', 14)}<input class="search-input" id="search-input" placeholder="Search by name, email, source…" value="${escapeAttr(state.search)}" oninput="setSearch(this.value)" /></div>
        <select class="filter-select" onchange="setFilter(this.value)">
          <option value="all"${state.filterStatus === 'all' ? ' selected' : ''}>All statuses</option>
          <option value="new"${state.filterStatus === 'new' ? ' selected' : ''}>New</option>
          <option value="contacted"${state.filterStatus === 'contacted' ? ' selected' : ''}>Contacted</option>
          <option value="converted"${state.filterStatus === 'converted' ? ' selected' : ''}>Converted</option>
          <option value="lost"${state.filterStatus === 'lost' ? ' selected' : ''}>Lost</option>
        </select>
      </div>
      <div class="table-wrap">
      <table>
        <thead><tr>
          <th class="sortable" style="width:30%" onclick="setSort('name')">Lead${sortArrow('name')}</th>
          <th class="sortable" style="width:18%" onclick="setSort('source')">Source${sortArrow('source')}</th>
          <th class="sortable" style="width:16%" onclick="setSort('status')">Status${sortArrow('status')}</th>
          <th class="sortable" style="width:14%" onclick="setSort('date')">Date${sortArrow('date')}</th>
          <th style="width:12%">Notes</th>
          <th style="width:10%">Actions</th>
        </tr></thead>
        <tbody>
          ${leads.length ? leads.map(l => `<tr>
            <td><div class="lead-name-cell">
              <div class="avatar ${colorFor(l.name)}">${initials(l.name)}</div>
              <div><div>${escapeHtml(l.name)}</div><div class="lead-email">${escapeHtml(l.email)}</div></div>
            </div></td>
            <td>${escapeHtml(l.source)}</td>
            <td><select class="status-pill ${statusClass[l.status]}" style="background-image:${selectArrowDataUri(encodeURIComponent(getStatusIconColor(l.status)))}" onchange="changeStatus('${l.id}',this.value)">
              ${['new', 'contacted', 'converted', 'lost'].map(s => `<option value="${s}"${l.status === s ? ' selected' : ''}>${statusLabel[s]}</option>`).join('')}
            </select></td>
            <td>${fmtDate(l.date)}</td>
            <td style="text-align:center">${l.notes.length ? `<span style="font-size:12px;color:var(--color-text-secondary)">${l.notes.length}</span>` : '<span style="color:var(--color-text-secondary);font-size:12px">—</span>'}</td>
            <td>
              <button class="action-btn" onclick="openLead('${l.id}')" title="View & notes">${icon('eye', 16)}</button>
              <button class="action-btn" onclick="deleteLead('${l.id}')" title="Delete">${icon('trash', 16)}</button>
            </td>
          </tr>`).join('') : `<tr><td colspan="6"><div class="empty-state">${icon('users', 28)}<div>No leads found</div></div></td></tr>`}
        </tbody>
      </table>
      </div>
    </div>`;
  }

  function getStatusIconColor(status) {
    // solid color used for the tiny chevron on each status select
    switch (status) {
      case 'new': return '#3C3489';
      case 'contacted': return '#0C447C';
      case 'converted': return '#1E6B3C';
      case 'lost': return '#A23434';
      default: return '#6B6E76';
    }
  }

  function renderAnalytics() {
    const total = state.leads.length;
    const byStatus = s => state.leads.filter(l => l.status === s).length;
    const pct = n => total ? Math.round(n / total * 100) : 0;
    return `
    <div class="section-header"><div class="section-title">Analytics</div></div>
    <div class="metrics">
      <div class="metric"><div class="metric-label">Total leads</div><div class="metric-value">${total}</div></div>
      <div class="metric"><div class="metric-label">New</div><div class="metric-value" style="color:var(--accent)">${byStatus('new')}</div></div>
      <div class="metric"><div class="metric-label">Converted</div><div class="metric-value" style="color:var(--color-text-success)">${byStatus('converted')}</div></div>
      <div class="metric"><div class="metric-label">Conversion rate</div><div class="metric-value">${pct(byStatus('converted'))}%</div></div>
    </div>
    <div class="leads-table" style="padding:16px">
      <div style="font-size:13px;font-weight:600;margin-bottom:14px">Status breakdown</div>
      ${['new', 'contacted', 'converted', 'lost'].map(s => {
      const c = byStatus(s); const p = pct(c);
      return `<div style="margin-bottom:14px">
          <div style="display:flex;justify-content:space-between;margin-bottom:4px">
            <span class="status-pill ${statusClass[s]}" style="cursor:default;padding:3px 8px">${statusLabel[s]}</span>
            <span style="font-size:12px;color:var(--color-text-secondary)">${c} leads · ${p}%</span>
          </div>
          <div class="stat-bar"><div class="stat-fill" style="width:${p}%"></div></div>
        </div>`;
    }).join('')}
      <div style="margin-top:20px;font-size:13px;font-weight:600;margin-bottom:12px">Lead sources</div>
      ${total === 0 ? `<div class="empty-notes">No leads yet.</div>` : Object.entries(state.leads.reduce((a, l) => {a[l.source] = (a[l.source] || 0) + 1; return a}, {})).sort((a,b) => b[1]-a[1]).map(([src, cnt]) => `
        <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:0.5px solid var(--color-border-tertiary);font-size:13px">
          <span>${escapeHtml(src)}</span><span style="color:var(--color-text-secondary)">${cnt}</span>
        </div>`).join('')}
    </div>`;
  }

  function renderAddForm() {
    const f = state.addForm;
    return `
    <div class="section-header"><div class="section-title">Add new lead</div></div>
    <div class="leads-table" style="padding:20px;max-width:420px">
      <div class="form-group"><label class="form-label">Full name</label><input class="form-input" id="af-name" value="${escapeAttr(f.name)}" oninput="setAddForm('name',this.value)" placeholder="e.g. Priya Sharma" /></div>
      <div class="form-group"><label class="form-label">Email</label><input class="form-input" id="af-email" value="${escapeAttr(f.email)}" oninput="setAddForm('email',this.value)" placeholder="e.g. priya@company.com" type="email" /></div>
      <div class="form-group"><label class="form-label">Source</label>
        <select class="form-input" onchange="setAddForm('source',this.value)">
          ${['Contact Form', 'LinkedIn', 'Referral', 'Instagram', 'Cold Outreach', 'Other'].map(s => `<option${f.source === s ? ' selected' : ''}>${s}</option>`).join('')}
        </select>
      </div>
      <div class="form-group"><label class="form-label">Initial status</label>
        <select class="form-input" onchange="setAddForm('status',this.value)">
          ${['new', 'contacted'].map(s => `<option value="${s}"${f.status === s ? ' selected' : ''}>${statusLabel[s]}</option>`).join('')}
        </select>
      </div>
      <button class="btn btn-primary" onclick="submitAddForm()" style="width:100%;justify-content:center">${icon('plus', 15)}Add lead</button>
    </div>`;
  }

  function renderModal() {
    const l = state.modal;
    const ai = state.aiInsight;
    return `<div class="modal-overlay" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()" role="dialog" aria-modal="true">
      <div class="modal-title">
        <div style="display:flex;align-items:center;gap:10px;min-width:0">
          <div class="avatar ${colorFor(l.name)}" style="width:36px;height:36px;font-size:13px;flex-shrink:0">${initials(l.name)}</div>
          <div style="min-width:0"><div>${escapeHtml(l.name)}</div><div style="font-size:12px;color:var(--color-text-secondary);overflow:hidden;text-overflow:ellipsis">${escapeHtml(l.email)}</div></div>
        </div>
        <button class="action-btn" onclick="state.modal=null;render()" aria-label="Close">${icon('x', 16)}</button>
      </div>
      <div class="form-row" style="margin-bottom:14px">
        <div><div class="form-label">Source</div><div style="font-size:13px">${escapeHtml(l.source)}</div></div>
        <div><div class="form-label">Date</div><div style="font-size:13px">${fmtDate(l.date)}</div></div>
      </div>
      <div style="margin-bottom:14px">
        <div class="form-label">Status</div>
        <select class="status-pill ${statusClass[l.status]}" style="background-image:${selectArrowDataUri(encodeURIComponent(getStatusIconColor(l.status)))}" onchange="changeStatusModal('${l.id}',this.value)">
          ${['new', 'contacted', 'converted', 'lost'].map(s => `<option value="${s}"${l.status === s ? ' selected' : ''}>${statusLabel[s]}</option>`).join('')}
        </select>
      </div>
      <div>
        <div class="form-label">Notes & follow-ups</div>
        <div class="notes-list">
          ${l.notes.length ? l.notes.map(n => `<div class="note-item"><div class="note-time">${new Date(n.time).toLocaleString('en-IN', {day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'})}</div>${escapeHtml(n.text)}</div>`).join('') : '<div class="empty-notes">No notes yet.</div>'}
        </div>
        <div style="display:flex;gap:8px;margin-top:10px">
          <input class="form-input" id="note-input" placeholder="Add a follow-up note…" value="${escapeAttr(state.newNote)}" oninput="state.newNote=this.value" onkeydown="if(event.key==='Enter')addNote('${l.id}')" style="flex:1" />
          <button class="btn btn-sm btn-primary" onclick="addNote('${l.id}')" aria-label="Add note">${icon('send', 14)}</button>
        </div>
      </div>
      <div style="margin-top:16px;border-top:0.5px solid var(--color-border-tertiary);padding-top:14px">
        <div class="form-label" style="margin-bottom:8px">AI insight</div>
        ${ai ? `<div class="ai-response${state.aiError ? ' ai-error' : ''}">${escapeHtml(ai)}</div>` : ''}
        <button class="btn btn-sm ${state.aiLoading ? '' : 'btn-primary'}" onclick="getAIInsight('${l.id}')" ${state.aiLoading ? 'disabled' : ''}>
          ${icon('sparkles', 14)}${state.aiLoading ? 'Thinking…' : 'Get AI insight'}
        </button>
      </div>
      <div class="modal-footer">
        <button class="btn btn-sm" onclick="state.modal=null;render()">Close</button>
      </div>
    </div>
  </div>`;
  }

  /* ---------- small helpers ---------- */
  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function escapeAttr(s) { return escapeHtml(s); }

  /* ---------- actions ---------- */
  function doLogin() {
    const u = document.getElementById('uname').value;
    const p = document.getElementById('upass').value;
    if (u === 'admin' && p === 'admin123') {
      state.loggedIn = true;
      try { sessionStorage.setItem(SESSION_KEY, '1'); } catch (e) {}
      render();
    } else { alert('Invalid credentials. Use admin / admin123'); }
  }
  function logout() {
    state.loggedIn = false; state.view = 'leads';
    try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {}
    render();
  }
  function setView(v) { state.view = v; render(); }
  function setSearch(v) { state.search = v; render(); }
  function setFilter(v) { state.filterStatus = v; render(); }
  function setSort(key) {
    if (state.sortKey === key) { state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc'; }
    else { state.sortKey = key; state.sortDir = 'asc'; }
    render();
  }

  async function changeStatus(id, s) {
    if (dbApi) {
      dbApi.collection('leads').doc(id).update({status: s}).catch(() => showToast('Could not update status.'));
    } else {
      state.leads = state.leads.map(l => l.id === id ? {...l, status: s} : l);
      saveLocalLeads();
    }
    render();
  }
  async function changeStatusModal(id, s) {
    if (dbApi) {
      dbApi.collection('leads').doc(id).update({status: s}).catch(() => showToast('Could not update status.'));
    } else {
      state.leads = state.leads.map(l => l.id === id ? {...l, status: s} : l);
      state.modal = state.leads.find(l => l.id === id);
      saveLocalLeads();
    }
    render();
  }

  async function deleteLead(id) {
    if (!confirm('Delete this lead?')) return;
    if (dbApi) {
      dbApi.collection('leads').doc(id).delete().catch(() => showToast('Could not delete lead.'));
    } else {
      state.leads = state.leads.filter(l => l.id !== id);
      saveLocalLeads();
      render();
    }
  }

  function openLead(id) { state.modal = state.leads.find(l => l.id === id); state.aiInsight = ''; state.aiError = false; state.newNote = ''; render(); }
  function closeModal(e) { if (e.target.classList.contains('modal-overlay')) { state.modal = null; render(); } }

  async function addNote(id) {
    if (!state.newNote.trim()) return;
    const note = {text: state.newNote.trim(), time: new Date().toISOString()};
    const lead = state.leads.find(l => l.id === id);
    const notes = [...(lead ? lead.notes : []), note];
    if (dbApi) {
      dbApi.collection('leads').doc(id).update({notes}).catch(() => showToast('Could not save note.'));
      state.newNote = '';
      render();
    } else {
      state.leads = state.leads.map(l => l.id === id ? {...l, notes} : l);
      state.modal = state.leads.find(l => l.id === id);
      state.newNote = '';
      saveLocalLeads();
      render();
    }
  }

  function setAddForm(k, v) { state.addForm[k] = v; }

  async function submitAddForm() {
    const f = state.addForm;
    if (!f.name.trim() || !f.email.trim()) { alert('Name and email are required.'); return; }
    const lead = {name: f.name.trim(), email: f.email.trim(), source: f.source, status: f.status, date: new Date().toISOString().split('T')[0], notes: []};
    if (dbApi) {
      const id = newLeadId();
      dbApi.collection('leads').doc(id).set(lead).catch(() => showToast('Could not save lead.'));
    } else {
      state.leads.unshift({id: String(state.nextId++), ...lead});
      saveLocalLeads();
    }
    state.addForm = {name: '', email: '', source: 'Contact Form', status: 'new'};
    state.view = 'leads';
    render();
  }

  async function getAIInsight(id) {
    const l = state.leads.find(x => x.id === id);
    if (!l) return;
    if (!sampleApi) {
      state.aiInsight = 'AI insight needs Claude access, which isn\u2019t available in this view.';
      state.aiError = true;
      render();
      return;
    }
    state.aiLoading = true; state.aiInsight = ''; state.aiError = false; render();
    const notes = l.notes.map(n => n.text).join('; ') || 'No notes yet';
    const prompt = `You are a CRM assistant. Analyze this lead and give a 2-sentence actionable follow-up suggestion.\nLead: ${l.name}, ${l.email}\nSource: ${l.source}\nStatus: ${l.status}\nNotes: ${notes}`;
    try {
      const result = await sampleApi(prompt, {
        modelTier: 'quick',
        onText: ({text}) => {
          state.aiInsight = text;
          const box = document.getElementById('app');
          if (box) render();
        }
      });
      state.aiInsight = result.text;
      state.aiError = false;
    } catch (e) {
      const code = e && e.code;
      if (code === 'not_granted') state.aiInsight = 'AI insight was declined for this session.';
      else if (code === 'rate_limited') state.aiInsight = 'Too many requests right now — try again shortly.';
      else if (code === 'sampling_disabled' || code === 'not_declared') state.aiInsight = 'AI insight is not available for this account.';
      else state.aiInsight = (e && e.text) || 'Could not fetch insight. Please try again.';
      state.aiError = true;
    }
    state.aiLoading = false;
    state.modal = state.leads.find(x => x.id === id) || state.modal;
    render();
  }

  function csvEscape(v) {
    v = String(v ?? '');
    return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }

  async function exportCSV() {
    const rows = [['Name', 'Email', 'Source', 'Status', 'Date', 'Notes']];
    sortedFilteredLeads().forEach(l => rows.push([
      l.name, l.email, l.source, statusLabel[l.status], l.date, l.notes.map(n => n.text).join(' | ')
    ]));
    const csv = rows.map(r => r.map(csvEscape).join(',')).join('\n');
    if (downloadsApi) {
      try {
        await downloadsApi.save({filename: 'leads.csv', data: csv});
        showToast('Leads exported.');
      } catch (e) {
        if (e && e.code === 'declined') return;
        showToast('Could not export CSV in this view.');
      }
    } else {
      showToast('Downloads are not available in this view.');
    }
  }

  boot();
</script>
</body>
</html>
